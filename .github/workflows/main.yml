name: Android CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Sanitize Build Files (Removes Google Services / Firebase syntax)
      run: |
        sed -i '/GoogleServicesPlugin/d' app/build.gradle.kts || true
        sed -i '/googleServices {/d' app/build.gradle.kts || true
        sed -i '/missingGoogleServicesStrategy/d' app/build.gradle.kts || true
        sed -i '/MissingGoogleServicesStrategy/d' app/build.gradle.kts || true
        sed -i '/alias(libs.plugins.google.services)/d' app/build.gradle.kts || true
        sed -i '/libs.firebase.ai/d' app/build.gradle.kts || true
        sed -i '/libs.firebase.appcheck/d' app/build.gradle.kts || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Keystores for CI
      run: |
        if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        fi
        if [ ! -f "debug.keystore" ]; then
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug, O=Android, C=US"
        fi
        if [ ! -f "my-upload-key.jks" ]; then
          keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=AetherStudio, OU=Dev, O=Aether, L=Global, S=Global, C=US"
        fi

    - name: Inject Google AI Studio API Key (If provided)
      env:
        API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        if [ -n "$API_KEY" ]; then
          echo "apiKey=$API_KEY" >> local.properties
        fi

    - name: Grant Execute Permission to Gradle Wrapper
      run: chmod +x gradlew

    - name: Configure Robolectric for CI Environment
      run: |
        mkdir -p ~/.gradle
        echo "robolectric.offline=true" >> ~/.gradle/gradle.properties
        echo "robolectric.logging=stdout" >> ~/.gradle/gradle.properties

    - name: Run Unit Tests
      continue-on-error: true
      run: ./gradlew testDebugUnitTest --continue --stacktrace
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        STORE_PASSWORD: android
        KEY_PASSWORD: android

    - name: Build Debug APK
      run: ./gradlew assembleDebug
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        STORE_PASSWORD: android
        KEY_PASSWORD: android

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: aetherstudio-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
