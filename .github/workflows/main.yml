name: Android CI/CD & Release Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Inject Google Services Configuration
      env:
        GOOGLE_SERVICES_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        echo "$GOOGLE_SERVICES_CONTENT" > app/google-services.json

    - name: Inject Google AI Studio API Key
      env:
        API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        # Injects the key into local.properties so your app can read it safely at build time
        echo "apiKey=$API_KEY" >> local.properties

    - name: Grant Execute Permission to Gradle Wrapper
      run: chmod +x gradlew

    - name: Configure Robolectric for CI Environment
      run: |
        # Creates a gradle properties override to force Robolectric to behave in headless offline mode
        mkdir -p ~/.gradle
        echo "robolectric.offline=true" >> ~/.gradle/gradle.properties
        echo "robolectric.logging=stdout" >> ~/.gradle/gradle.properties

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --continue --stacktrace

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
